name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, performance, headers, audit and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: High-confidence secret history scan
        shell: bash
        run: |
          PATTERN='-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{20,}|xox[baprs]-[0-9A-Za-z-]{20,}'
          if git log --all -p --no-ext-diff -- . | grep -Eq -- "$PATTERN"; then
            echo '::error::Potential high-confidence secret pattern found in Git history. Rotate the credential if real, purge it from history, and re-run the workflow.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run perf:budget

      - name: Security headers smoke test
        shell: bash
        run: |
          npm run start -- -p 3010 -H 127.0.0.1 > /tmp/lar-security-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3010/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/lar-security-server.log || true
            echo '::error::Production server did not become ready for the header smoke test.'
            exit 1
          fi

          HEADERS="$(curl -fsS -D - -o /dev/null http://127.0.0.1:3010/ | tr -d '\r')"
          printf '%s\n' "$HEADERS"

          require_header() {
            local pattern="$1"
            local label="$2"
            if ! printf '%s\n' "$HEADERS" | grep -Eiq "$pattern"; then
              echo "::error::Missing or invalid ${label}."
              exit 1
            fi
          }

          require_header '^content-security-policy: .*frame-ancestors '\''none'\''' 'Content-Security-Policy frame protection'
          require_header '^content-security-policy: .*object-src '\''none'\''' 'Content-Security-Policy object protection'
          require_header '^x-content-type-options: nosniff$' 'X-Content-Type-Options'
          require_header '^x-frame-options: DENY$' 'X-Frame-Options'
          require_header '^referrer-policy: strict-origin-when-cross-origin$' 'Referrer-Policy'
          require_header '^permissions-policy: .*camera=\(\).*microphone=\(\).*geolocation=\(\)' 'Permissions-Policy'
          require_header '^strict-transport-security: max-age=63072000; includeSubDomains; preload$' 'Strict-Transport-Security'

          if printf '%s\n' "$HEADERS" | grep -Eiq '^x-powered-by:'; then
            echo '::error::X-Powered-By must remain disabled.'
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint
