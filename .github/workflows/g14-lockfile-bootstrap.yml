name: G14 Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'chore/g14-dependency-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout G14 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/g14-dependency-hygiene
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Refresh and commit lockfile when needed
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'G14: sincronizar package-lock com dependência CSS'
          git push origin HEAD:chore/g14-dependency-hygiene
